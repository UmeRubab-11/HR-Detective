<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Detective Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body { background: #f5f7fa; font-family: 'Inter', system-ui, sans-serif; }
.sidebar { background: #1e293b; }
.sidebar a.active { background: #facc15; color: #1e293b; font-weight: 600; }
.sidebar a:hover { background: #334155; color: white; }
.hero-banner {
  background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
}
.card-hover:hover { transform: translateY(-3px); transition: 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
.logo-bg { background: white; padding: 6px; border-radius: 10px; }
</style>
</head>
<body class="text-gray-800">

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="sidebar w-64 hidden md:flex flex-col text-gray-300">
    <div class="p-5 flex items-center gap-3 border-b border-slate-700">
      <div id="logoContainer" class="w-10 h-10 logo-bg flex items-center justify-center">
        <i class="fas fa-user-shield text-teal-600 text-lg"></i>
      </div>
      <div>
        <h2 class="font-bold text-white">HR DETECTIVE</h2>
        <p class="text-xs text-gray-400">Employee Management</p>
      </div>
    </div>
    <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
      <a href="#" data-nav="dashboard" class="nav-link active flex items-center gap-3 px-4 py-2.5 rounded-lg">
        <i class="fas fa-th-large"></i> Dashboard
      </a>
      <a href="#" data-nav="employees" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg">
        <i class="fas fa-users"></i> Employees <span id="empCount" class="ml-auto bg-slate-700 px-2 py-0.5 rounded text-xs">20</span>
      </a>
      <a href="#" data-nav="attendance" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg">
        <i class="fas fa-calendar-check"></i> Attendance
      </a>
      <a href="#" data-nav="payroll" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg">
        <i class="fas fa-money-bill"></i> Payroll
      </a>
      <a href="#" data-nav="applications" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg">
        <i class="fas fa-file-alt"></i> Applications
      </a>
      <a href="#" data-nav="documents" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg">
        <i class="fas fa-folder"></i> Documents
      </a>
    </nav>
    <div class="p-4 border-t border-slate-700">
      <div class="flex items-center gap-3">
        <div id="adminAvatar" class="w-9 h-9 rounded-full bg-teal-600 flex items-center justify-center text-white font-bold">UR</div>
        <div>
          <p class="text-sm font-semibold text-white">UmeRubab</p>
          <p class="text-xs text-yellow-400">Admin</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto">
    <div class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-20">
      <div>
        <h1 class="text-xl font-bold text-gray-800" id="pageTitle">Dashboard</h1>
        <p class="text-sm text-gray-500" id="greetingText">Loading...</p>
      </div>
      <div class="flex items-center gap-3">
        <input id="searchBox" type="text" placeholder="Search employees, documents..." class="border rounded-lg px-4 py-2 w-64 hidden md:block">
        <button onclick="showAddEmployee()" class="bg-teal-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-teal-700">
          <i class="fas fa-plus"></i> Quick Action
        </button>
        <div class="flex items-center gap-2">
          <div id="adminAvatarTop" class="w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center text-white font-bold">UR</div>
          <div class="hidden md:block">
            <p class="text-sm font-semibold">UmeRubab</p>
            <p class="text-xs bg-red-500 text-white px-2 rounded">Admin</p>
          </div>
        </div>
      </div>
    </div>

    <div id="mainContent" class="p-6"></div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div id="modalContent" class="bg-white rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto"></div>
</div>

<script>
let employees = JSON.parse(localStorage.getItem('hr_employees')) || [];
let attendance = JSON.parse(localStorage.getItem('hr_attendance')) || {};
let documents = JSON.parse(localStorage.getItem('hr_documents')) || [];
let applications = JSON.parse(localStorage.getItem('hr_applications')) || [];

let attendanceChart, deptChart;

// Seed 20 employees
if(employees.length === 0) {
  employees = [
    {id:1,name:"Sachin Sharma",role:"Accountant",dept:"Operations",salary:45000,status:"Present"},
    {id:2,name:"Akhilesh Prasad",role:"Store Keeper",dept:"Operations",salary:32000,status:"Present"},
    {id:3,name:"Bhola Bhardwaj",role:"Site Supervisor",dept:"Operations",salary:50000,status:"Leave"},
    {id:4,name:"Avadhesh Chaubey",role:"Billing Engineer",dept:"Operations",salary:60000,status:"Present"},
    {id:5,name:"Sakib Ali",role:"Employee",dept:"General",salary:25000,status:"Present"},
    {id:6,name:"Riya Mehta",role:"HR Manager",dept:"HR",salary:70000,status:"Present"},
    {id:7,name:"Arjun Nair",role:"Finance Lead",dept:"Finance",salary:75000,status:"Present"},
    {id:8,name:"Sarah Khan",role:"Designer",dept:"Design",salary:55000,status:"Leave"},
    {id:9,name:"Ali Hassan",role:"Developer",dept:"IT",salary:80000,status:"Present"},
    {id:10,name:"Fatima Noor",role:"Recruiter",dept:"HR",salary:40000,status:"Present"},
    {id:11,name:"Omar Farooq",role:"Sales Executive",dept:"Sales",salary:45000,status:"Present"},
    {id:12,name:"Ayesha Siddiqui",role:"Marketing",dept:"Marketing",salary:48000,status:"Present"},
    {id:13,name:"Hassan Raza",role:"Support",dept:"IT",salary:35000,status:"Present"},
    {id:14,name:"Zara Ahmed",role:"Content Writer",dept:"Marketing",salary:30000,status:"Present"},
    {id:15,name:"Bilal Khan",role:"Logistics",dept:"Operations",salary:38000,status:"Leave"},
    {id:16,name:"Nadia Malik",role:"Accountant",dept:"Finance",salary:42000,status:"Present"},
    {id:17,name:"Imran Qureshi",role:"Technician",dept:"IT",salary:40000,status:"Present"},
    {id:18,name:"Sana Javed",role:"Admin Assistant",dept:"HR",salary:32000,status:"Present"},
    {id:19,name:"Kashif Ali",role:"Driver",dept:"Operations",salary:25000,status:"Present"},
    {id:20,name:"Hina Sheikh",role:"QA Tester",dept:"IT",salary:50000,status:"Present"}
  ];
  saveAll();
}

function saveAll() {
  localStorage.setItem('hr_employees', JSON.stringify(employees));
  localStorage.setItem('hr_attendance', JSON.stringify(attendance));
  localStorage.setItem('hr_documents', JSON.stringify(documents));
  localStorage.setItem('hr_applications', JSON.stringify(applications));
}

// Auto-updating time-based greeting
function setGreeting() {
  const hour = new Date().getHours();
  let greet = "🌙 Good Evening";
  if(hour < 12) greet = "🌞 Good Morning";
  else if(hour < 17) greet = "☀️ Good Afternoon";

  document.getElementById('greetingText').innerText = `${greet}! Here's your HR overview.`;
  const bannerEl = document.getElementById('bannerGreeting');
  if(bannerEl) bannerEl.innerText = greet;
}

// Navigation
function setupNav() {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      let nav = link.dataset.nav;
      document.getElementById('pageTitle').innerText = link.innerText.trim();
      if(nav === 'dashboard') renderDashboard();
      if(nav === 'employees') renderEmployees();
      if(nav === 'attendance') renderAttendance();
      if(nav === 'payroll') renderPayroll();
      if(nav === 'applications') renderApplications();
      if(nav === 'documents') renderDocuments();
    });
  });
}

// Dashboard with charts
function renderDashboard() {
  const today = new Date().toDateString();
  const todayAtt = attendance[today] || {};
  const present = Object.values(todayAtt).filter(s => s === 'Present').length;
  const leave = Object.values(todayAtt).filter(s => s === 'Leave').length;
  const attendanceRate = employees.length? Math.round((present/employees.length)*100) : 0;

  document.getElementById('empCount').innerText = employees.length;

  document.getElementById('mainContent').innerHTML = `
    <div class="hero-banner rounded-2xl p-6 mb-6 text-white">
      <h2 class="text-3xl font-bold mb-2" id="bannerGreeting"></h2>
      <p class="text-teal-100">Here's what's happening with your team today.</p>
      <div class="grid grid-cols-3 gap-3 mt-6 max-w-lg">
        <div class="bg-white/20 backdrop-blur p-3 rounded-lg text-center">
          <p class="text-xs opacity-80">PRESENT</p>
          <p class="text-2xl font-bold">${present}</p>
        </div>
        <div class="bg-white/20 backdrop-blur p-3 rounded-lg text-center">
          <p class="text-xs opacity-80">ON LEAVE</p>
          <p class="text-2xl font-bold">${leave}</p>
        </div>
        <div class="bg-white/20 backdrop-blur p-3 rounded-lg text-center">
          <p class="text-xs opacity-80">ATTENDANCE</p>
          <p class="text-2xl font-bold">${attendanceRate}%</p>
        </div>
      </div>
    </div>

    <div class="grid md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm card-hover">
        <p class="text-sm text-gray-500">Total Employees</p>
        <p class="text-2xl font-bold">${employees.length}</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm card-hover">
        <p class="text-sm text-gray-500">Present Today</p>
        <p class="text-2xl font-bold">${present}</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm card-hover">
        <p class="text-sm text-gray-500">On Leave</p>
        <p class="text-2xl font-bold">${leave}</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm card-hover">
        <p class="text-sm text-gray-500">Total Payroll</p>
        <p class="text-2xl font-bold">₹${employees.reduce((a,b)=>a+b.salary,0).toLocaleString()}</p>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-6">
      <div class="bg-white p-5 rounded-xl shadow-sm lg:col-span-2">
        <div class="flex justify-between mb-4">
          <div>
            <h3 class="font-semibold">Weekly Attendance</h3>
            <p class="text-xs text-gray-500">Last 7 days</p>
          </div>
          <span class="text-2xl font-bold">${attendanceRate}%</span>
        </div>
        <canvas id="attendanceChart" height="80"></canvas>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm">
        <h3 class="font-semibold mb-4">Departments</h3>
        <canvas id="deptChart" height="150"></canvas>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-6 mt-6">
      <div class="bg-white p-5 rounded-xl shadow-sm lg:col-span-2">
        <h3 class="font-semibold mb-4">Team Directory</h3>
        <div class="space-y-3 max-h-80 overflow-y-auto">
          ${employees.slice(0,8).map(emp => `
            <div class="flex items-center justify-between border-b pb-2">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-100 rounded-full flex items-center justify-center font-bold text-teal-700">
                  ${emp.name.split(' ').map(n=>n[0]).join('')}
                </div>
                <div>
                  <p class="font-medium text-sm">${emp.name}</p>
                  <p class="text-xs text-gray-500">${emp.role}</p>
                </div>
              </div>
              <span class="text-xs bg-gray-100 px-2 py-1 rounded">${emp.dept}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm">
        <h3 class="font-semibold mb-4">Quick Actions</h3>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="showAddEmployee()" class="border rounded-lg p-3 text-center hover:bg-teal-50">
            <i class="fas fa-user-plus text-teal-600 mb-2"></i>
            <p class="text-xs">Add Employee</p>
          </button>
          <button onclick="showMarkAttendance()" class="border rounded-lg p-3 text-center hover:bg-teal-50">
            <i class="fas fa-calendar-check text-teal-600 mb-2"></i>
            <p class="text-xs">Mark Attendance</p>
          </button>
          <button onclick="showAddDocument()" class="border rounded-lg p-3 text-center hover:bg-teal-50">
            <i class="fas fa-upload text-teal-600 mb-2"></i>
            <p class="text-xs">Upload Doc</p>
          </button>
          <button onclick="showAddApplication()" class="border rounded-lg p-3 text-center hover:bg-teal-50">
            <i class="fas fa-file-alt text-teal-600 mb-2"></i>
            <p class="text-xs">New Application</p>
          </button>
        </div>
      </div>
    </div>
  `;

  setGreeting();

  // Destroy old charts before creating new ones
  if(attendanceChart) attendanceChart.destroy();
  if(deptChart) deptChart.destroy();

  attendanceChart = new Chart(document.getElementById('attendanceChart'), {
    type: 'line',
    data: {
      labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
      datasets: [{
        label: 'Present',
        data: [18,20,19,21,22,10,5],
        borderColor: '#14b8a6',
        backgroundColor: 'rgba(20,184,166,0.2)',
        fill: true,
        tension: 0.4
      }]
    },
    options: {plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, stepSize:5}}}
  });

  const deptCount = {};
  employees.forEach(e => deptCount[e.dept] = (deptCount[e.dept] || 0) + 1);

  deptChart = new Chart(document.getElementById('deptChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(deptCount),
      datasets: [{
        data: Object.values(deptCount),
        backgroundColor: ['#facc15','#14b8a6','#0ea5e9','#8b5cf6','#f43f5e','#6366f1']
      }]
    },
    options: {plugins:{legend:{position:'bottom',labels:{boxWidth:12, font:{size:11}}}}}
  });
}

// Search - searches BOTH employees and documents
function showSearchResults(emps, docs) {
  if(!document.getElementById('searchResults')) {
    const div = document.createElement('div');
    div.id = 'searchResults';
    div.className = 'bg-white p-4 rounded-xl shadow-sm mb-4';
    document.getElementById('mainContent').prepend(div);
  }

  document.getElementById('searchResults').innerHTML = `
    <h3 class="font-semibold mb-3">Search Results</h3>
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <h4 class="text-sm font-semibold text-gray-600 mb-2">Employees (${emps.length})</h4>
        ${emps.slice(0,5).map(e => `<p class="text-sm py-1">• ${e.name} - ${e.role}</p>`).join('') || '<p class="text-xs text-gray-400">No employees found</p>'}
      </div>
      <div>
        <h4 class="text-sm font-semibold text-gray-600 mb-2">Documents (${docs.length})</h4>
        ${docs.slice(0,5).map(d => `<p class="text-sm py-1">• ${d.name}</p>`).join('') || '<p class="text-xs text-gray-400">No documents found</p>'}
      </div>
    </div>
  `;
}

function renderEmployees(query='') {
  const filtered = employees.filter(e =>
    e.name.toLowerCase().includes(query) ||
    e.role.toLowerCase().includes(query) ||
    e.dept.toLowerCase().includes(query)
  );

  document.getElementById('mainContent').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Employee Directory</h2>
        <button onclick="showAddEmployee()" class="bg-teal-600 text-white px-4 py-2 rounded-lg">+ Add Employee</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left p-3">Employee</th>
              <th class="text-left p-3">Role</th>
              <th class="text-left p-3">Department</th>
              <th class="text-left p-3">Salary</th>
              <th class="text-left p-3">Status</th>
              <th class="text-left p-3">Action</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(emp => `
              <tr class="border-b hover:bg-gray-50">
                <td class="p-3 flex items-center gap-3">
                  <div class="w-8 h-8 bg-teal-100 rounded-full flex items-center justify-center font-bold text-teal-700">
                    ${emp.name.split(' ').map(n=>n[0]).join('')}
                  </div>
                  ${emp.name}
                </td>
                <td class="p-3">${emp.role}</td>
                <td class="p-3">${emp.dept}</td>
                <td class="p-3">₹${emp.salary.toLocaleString()}</td>
                <td class="p-3">
                  <span class="px-2 py-1 rounded-full text-xs ${emp.status==='Present'?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'}">
                    ${emp.status}
                  </span>
                </td>
                <td class="p-3">
                  <button onclick="editSalary(${emp.id})" class="text-teal-600 hover:underline">Edit Salary</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderAttendance() {
  const month = new Date().toISOString().slice(0,7);
  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  let labels = [];
  let data = [];

  for(let i=1; i<=daysInMonth; i++) {
    let date = `${month}-${String(i).padStart(2,'0')}`;
    let dayAtt = attendance[date] || {};
    let presentCount = Object.values(dayAtt).filter(s => s==='Present').length;
    labels.push(i);
    data.push(presentCount);
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Attendance - ${new Date().toLocaleString('en-US',{month:'long', year:'numeric'})}</h2>
        <button onclick="showMarkAttendance()" class="bg-teal-600 text-white px-4 py-2 rounded-lg">Mark Attendance</button>
      </div>
      <canvas id="attendanceChartMonth" height="100"></canvas>
    </div>
  `;

  new Chart(document.getElementById('attendanceChartMonth'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Present Employees',
        data: data,
        backgroundColor: '#14b8a6'
      }]
    },
    options: {scales:{y:{beginAtZero:true, stepSize:1}}}
  });
}

function showMarkAttendance() {
  const today = new Date().toDateString();
  const todayAtt = attendance[today] || {};

  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <h3 class="text-xl font-bold mb-4">Mark Attendance - ${new Date().toLocaleDateString()}</h3>
    <div class="space-y-2 max-h-80 overflow-y-auto">
      ${employees.map(emp => `
        <div class="flex justify-between items-center border-b py-2">
          <span>${emp.name}</span>
          <select id="att_${emp.id}" class="border rounded px-2 py-1">
            <option ${todayAtt[emp.id]==='Present'?'selected':''}>Present</option>
            <option ${todayAtt[emp.id]==='Leave'?'selected':''}>Leave</option>
            <option ${todayAtt[emp.id]==='Absent'?'selected':''}>Absent</option>
          </select>
        </div>
      `).join('')}
    </div>
    <button onclick="saveAttendance()" class="mt-4 w-full bg-teal-600 text-white py-2 rounded-lg">Save Attendance</button>
  `;
}

function saveAttendance() {
  const today = new Date().toDateString();
  attendance[today] = {};
  employees.forEach(emp => {
    attendance[today][emp.id] = document.getElementById(`att_${emp.id}`).value;
    emp.status = attendance[today][emp.id];
  });
  saveAll();
  closeModal();
  renderDashboard();
}

function renderPayroll() {
  const totalSalary = employees.reduce((a,b)=>a+b.salary,0);
  document.getElementById('mainContent').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="text-xl font-bold mb-4">Payroll Management</h2>
      <div class="mb-4 p-4 bg-teal-50 rounded-lg">
        <p class="text-sm text-gray-600">Total Monthly Payroll</p>
        <p class="text-3xl font-bold text-teal-700">₹${totalSalary.toLocaleString()}</p>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left p-3">Employee</th>
              <th class="text-left p-3">Role</th>
              <th class="text-left p-3">Salary</th>
              <th class="text-left p-3">Action</th>
            </tr>
          </thead>
          <tbody>
            ${employees.map(emp => `
              <tr class="border-b">
                <td class="p-3">${emp.name}</td>
                <td class="p-3">${emp.role}</td>
                <td class="p-3">₹${emp.salary.toLocaleString()}</td>
                <td class="p-3">
                  <button onclick="processSalary(${emp.id})" class="bg-green-600 text-white px-3 py-1 rounded text-xs">Process Payment</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function processSalary(id) {
  alert(`Salary processed for employee ID: ${id}.`);
}

function renderApplications() {
  document.getElementById('mainContent').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Job Applications</h2>
        <button onclick="showAddApplication()" class="bg-teal-600 text-white px-4 py-2 rounded-lg">+ New Application</button>
      </div>
      <div class="space-y-3">
        ${applications.length === 0? '<p class="text-gray-500">No applications yet</p>' :
        applications.map(app => `
          <div class="border rounded-lg p-4">
            <h4 class="font-semibold">${app.position}</h4>
            <p class="text-sm text-gray-600">${app.name} - ${app.email}</p>
            <p class="text-xs text-gray-500 mt-1">${app.message}</p>
            <span class="text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-700 mt-2 inline-block">${app.status}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderDocuments(query='') {
  const filtered = documents.filter(d => d.name.toLowerCase().includes(query));

  document.getElementById('mainContent').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Documents</h2>
        <button onclick="showAddDocument()" class="bg-teal-600 text-white px-4 py-2 rounded-lg">+ Upload Document</button>
      </div>
      <div class="grid md:grid-cols-3 gap-4">
        ${filtered.length === 0? '<p class="text-gray-500">No documents found</p>' :
        filtered.map(doc => `
          <div class="border rounded-lg p-4">
            <i class="fas fa-file-pdf text-red-500 text-2xl mb-2"></i>
            <p class="font-medium text-sm">${doc.name}</p>
            <p class="text-xs text-gray-500">${doc.size} KB</p>
            <a href="${doc.url}" download="${doc.name}" class="text-teal-600 text-xs hover:underline">Download</a>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Modals
function showAddEmployee() {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <h3 class="text-xl font-bold mb-4">Add New Employee</h3>
    <div class="space-y-3">
      <input id="empName" placeholder="Full Name" class="w-full border rounded-lg p-2">
      <input id="empRole" placeholder="Role" class="w-full border rounded-lg p-2">
      <input id="empDept" placeholder="Department" class="w-full border rounded-lg p-2">
      <input id="empSalary" type="number" placeholder="Salary" class="w-full border rounded-lg p-2">
      <button onclick="addEmployee()" class="w-full bg-teal-600 text-white py-2 rounded-lg">Add Employee</button>
    </div>
  `;
}

function addEmployee() {
  const name = document.getElementById('empName').value;
  const role = document.getElementById('empRole').value;
  const dept = document.getElementById('empDept').value;
  const salary = parseInt(document.getElementById('empSalary').value) || 0;
  if(!name) return alert('Enter name');

  employees.push({id: Date.now(), name, role, dept, salary, status: 'Present'});
  saveAll();
  closeModal();
  renderDashboard();
}

function showAddDocument() {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <h3 class="text-xl font-bold mb-4">Upload Document</h3>
    <input type="file" id="docFile" class="w-full border rounded-lg p-2">
    <button onclick="uploadDocument()" class="mt-4 w-full bg-teal-600 text-white py-2 rounded-lg">Upload</button>
  `;
}

function uploadDocument() {
  const file = document.getElementById('docFile').files[0];
  if(!file) return alert('Select a file');

  const reader = new FileReader();
  reader.onload = function(e) {
    documents.push({
      id: Date.now(),
      name: file.name,
      size: Math.round(file.size/1024),
      url: e.target.result
    });
    saveAll();
    closeModal();
    renderDocuments();
  };
  reader.readAsDataURL(file);
}

function showAddApplication() {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <h3 class="text-xl font-bold mb-4">New Job Application</h3>
    <div class="space-y-3">
      <input id="appName" placeholder="Applicant Name" class="w-full border rounded-lg p-2">
      <input id="appEmail" placeholder="Email" class="w-full border rounded-lg p-2">
      <input id="appPosition" placeholder="Position Applied" class="w-full border rounded-lg p-2">
      <textarea id="appMsg" placeholder="Message" class="w-full border rounded-lg p-2" rows="3"></textarea>
      <button onclick="addApplication()" class="w-full bg-teal-600 text-white py-2 rounded-lg">Submit Application</button>
    </div>
  `;
}

function addApplication() {
  applications.push({
    id: Date.now(),
    name: document.getElementById('appName').value,
    email: document.getElementById('appEmail').value,
    position: document.getElementById('appPosition').value,
    message: document.getElementById('appMsg').value,
    status: 'Pending'
  });
  saveAll();
  closeModal();
  renderApplications();
}

function editSalary(id) {
  const emp = employees.find(e => e.id === id);
  const newSalary = prompt(`Enter new salary for ${emp.name}:`, emp.salary);
  if(newSalary) {
    emp.salary = parseInt(newSalary);
    saveAll();
    renderPayroll();
  }
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  setGreeting();
  setupNav();
  renderDashboard();

  // Auto-update greeting every 60 seconds
  setInterval(setGreeting, 60000);

  // Search functionality
  document.getElementById('searchBox').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const page = document.getElementById('pageTitle').innerText;

    if(page.includes('Employee')) renderEmployees(query);
    if(page.includes('Document')) renderDocuments(query);
    if(page.includes('Dashboard')) {
      const empResults = employees.filter(e => e.name.toLowerCase().includes(query));
      const docResults = documents.filter(d => d.name.toLowerCase().includes(query));
      showSearchResults(empResults, docResults);
    }
  });
});
</script>
</body>
</html>
